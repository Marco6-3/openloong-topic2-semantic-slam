notes:
  - 类别由轻量模型自身能力定义，符合组委会“不提供固定类别列表”的答复。
  - 标签名称沿用 SemanticKITTI 的 19 个学习类别；跨域到 Livox 场景的置信度会在多帧融合后披露。
  - 颜色由 SemanticKITTI 官方 BGR 色表转换为 PCD 使用的 RGB。
  - 单帧类别不能判断目标是否正在运动，因此车辆和人员仅标为动态候选，不直接从地图删除。
